<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring - Save The Ocean v2.4 (Final)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <style>
        :root {
            --bg-primary: #0A192F;
            --bg-secondary: #112240;
            --bg-tertiary: #233554;
            --text-primary: #E6F1FF;
            --text-secondary: #8892B0;
            --accent-primary: #64FFDA;
            --accent-secondary: #3A86FF;
            --error-bg: #ff4c4c2a;
            --error-text: #FF4C4C;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "SF Mono", "Fira Code", "Fira Mono", "Roboto Mono", monospace;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--accent-primary);
            font-size: 2.5em;
            margin: 0;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1em;
        }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: auto auto;
            gap: 20px;
            grid-template-areas:
                "chart1 chart2 status"
                "chart3 chart4 serial";
        }

        .grid-item {
            background-color: var(--bg-secondary);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px -15px rgba(0,0,0,0.7);
            border: 1px solid var(--bg-tertiary);
        }

        .grid-item h2 {
            text-align: center;
            color: var(--text-primary);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.2em;
        }

        #chart-water { grid-area: chart1; }
        #chart-air { grid-area: chart2; }
        #chart-temp { grid-area: chart3; }
        #chart-level { grid-area: chart4; }
        #status-panel { grid-area: status; }
        #serial-panel { grid-area: serial; }

        .chart-container {
            height: 38vh;
        }
        
        .chart-error-overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            flex-direction: column;
            text-align: center;
            background-color: var(--error-bg);
            border-radius: 8px;
            border: 1px solid var(--error-text);
        }
        .chart-error-overlay h3 { margin: 0 0 10px 0; color: var(--error-text); }
        .chart-error-overlay p { margin: 0; color: var(--text-secondary); font-size: 0.9em; }

        /* Status Panel Styles */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            height: 100%;
            align-content: center;
        }
        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .status-item .label {
            color: var(--text-secondary);
            font-size: 1em;
            margin-bottom: 10px;
        }
        .status-item .value-display {
            font-weight: bold;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transition: background-color 0.3s ease;
        }
        #conveyorStatus .status-indicator.on { background-color: var(--accent-primary); }
        #conveyorStatus .status-indicator.off { background-color: #FF4C4C; }

        #gyroStatus .value-display {
            font-size: 1.8em;
        }
        
        .control-button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            color: var(--bg-primary);
            background-color: var(--accent-primary);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .control-button:hover { background-color: white; }

        /* Serial Monitor Styles */
        #serialMonitorOutput {
            background-color: var(--bg-primary);
            color: var(--text-secondary);
            padding: 15px;
            border-radius: 5px;
            height: calc(100% - 50px); 
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: var(--font-mono);
            font-size: 0.9em;
            border: 1px solid var(--bg-tertiary);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        @media (max-width: 1200px) {
            .main-grid { grid-template-columns: 1fr 1fr; grid-template-areas: "chart1 chart2" "chart3 chart4" "status serial"; }
        }
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; grid-template-areas: "chart1" "chart2" "chart3" "chart4" "status" "serial"; }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SAVE THE OCEAN</h1>
            <p>Real-Time Monitoring Dashboard</p>
        </div>
        
        <div class="main-grid">
            <div id="chart-water" class="grid-item">
                <h2>Kualitas Air (pH)</h2>
                <div class="chart-container"><canvas id="waterChart"></canvas></div>
            </div>
            <div id="chart-air" class="grid-item">
                <h2>Kualitas Udara</h2>
                <div class="chart-container"><canvas id="airChart"></canvas></div>
            </div>
            <div id="chart-temp" class="grid-item">
                <h2>Suhu</h2>
                <div class="chart-container"><canvas id="tempChart"></canvas></div>
            </div>
            <div id="chart-level" class="grid-item">
                <h2>Level Air</h2>
                <div class="chart-container"><canvas id="levelChart"></canvas></div>
            </div>

            <div id="status-panel" class="grid-item">
                <h2>Status Perangkat</h2>
                <div class="status-grid">
                    <div id="gyroStatus" class="status-item">
                        <span class="label">Kemiringan Perahu</span>
                        <span class="value-display">CENTER</span>
                    </div>
                    <div id="conveyorStatus" class="status-item">
                        <span class="label">Konveyor Sampah</span>
                        <span class="value-display">
                            <div class="status-indicator off"></div>
                            <span>OFF</span>
                        </span>
                        <button id="conveyorToggleButton" class="control-button">Nyalakan</button>
                    </div>
                </div>
            </div>

            <div id="serial-panel" class="grid-item">
                <h2>Live Serial Monitor</h2>
                <pre id="serialMonitorOutput">Menunggu data masuk...</pre>
            </div>
        </div>
    </div>

    <div class="footer">
        &copy; 2025 - Dibuat oleh Team Darubot
    </div>

    <script>
        let allCharts = [];
        let isConveyorOn = false;

        document.addEventListener('DOMContentLoaded', function () {
            
            try {
                const chartOptions = (yMax = 1023, title) => ({
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { type: 'time', time: { unit: 'second', displayFormats: { second: 'HH:mm:ss' } }, ticks: { color: 'var(--text-secondary)' }, grid: { color: 'rgba(136, 146, 176, 0.1)' } },
                        y: { min: 0, max: yMax, ticks: { color: 'var(--text-secondary)' }, grid: { color: 'rgba(136, 146, 176, 0.2)' } }
                    },
                    plugins: { legend: { display: false }, title: { display: false } },
                    animation: { duration: 400 }
                });

                const createChart = (ctx, label, color, yMax) => {
                    return new Chart(ctx, { 
                        type: 'line', 
                        data: { labels: [], datasets: [{ label: label, data: [], borderColor: color, backgroundColor: color + '2A', fill: true, tension: 0.4, pointRadius: 0 }] }, 
                        options: chartOptions(yMax, label) 
                    });
                };

                const waterChart = createChart(document.getElementById('waterChart').getContext('2d'), 'Kualitas Air', '#3A86FF', 1023);
                const airChart = createChart(document.getElementById('airChart').getContext('2d'), 'Kualitas Udara', '#17C3B2', 1023);
                const tempChart = createChart(document.getElementById('tempChart').getContext('2d'), 'Suhu', '#FF9F40', 1023);
                const levelChart = createChart(document.getElementById('levelChart').getContext('2d'), 'Level Air', '#33A1FF', 1023);

                allCharts = [waterChart, airChart, tempChart, levelChart];

            } catch (e) {
                console.error("KESALAHAN FATAL: Gagal memuat atau merender grafik. Error asli:", e);
                const chartContainers = document.querySelectorAll('.chart-container');
                chartContainers.forEach(container => {
                    container.innerHTML = `<div class="chart-error-overlay"><h3>Gagal Memuat Grafik</h3><p>Periksa Browser Console (F12).</p></div>`;
                });
            }

            const dataKeys = ['water', 'air', 'temp', 'level'];
            
            // Ambil elemen UI sekali saja untuk efisiensi
            const gyroStatusEl = document.querySelector('#gyroStatus .value-display');
            const conveyorStatusIndicator = document.querySelector('#conveyorStatus .status-indicator');
            const conveyorStatusText = document.querySelector('#conveyorStatus .value-display span');
            const conveyorToggleButton = document.getElementById('conveyorToggleButton');
            const serialMonitorOutput = document.getElementById('serialMonitorOutput');

            async function updateDashboard() {
                try {
                    const dataResponse = await fetch('/data');
                    if (dataResponse.ok) {
                        const data = await dataResponse.json();
                        if (data && data.timestamp) {
                            const now = new Date();
                            
                            if (allCharts.length > 0) {
                                allCharts.forEach((chart, index) => {
                                    const key = dataKeys[index];
                                    const chartData = chart.data;
                                    chartData.labels.push(now);
                                    chartData.datasets[0].data.push(data[key]);
                                    
                                    const maxDataPoints = 10;
                                    if (chartData.labels.length > maxDataPoints) {
                                        chartData.labels.shift();
                                        chartData.datasets[0].data.shift();
                                    }
                                    chart.update('none');
                                });
                            }

                            // Update status panels (dengan null-check)
                            if (gyroStatusEl) {
                                if (data.gyro_right > 0) {
                                    gyroStatusEl.textContent = 'KANAN →';
                                } else if (data.gyro_left > 0) {
                                    gyroStatusEl.textContent = '← KIRI';
                                } else {
                                    gyroStatusEl.textContent = 'CENTER';
                                }
                            }

                            if (conveyorStatusIndicator && conveyorStatusText && conveyorToggleButton) {
                                isConveyorOn = (data.conveyor === 1);
                                if (isConveyorOn) {
                                    conveyorStatusText.textContent = 'ON';
                                    conveyorStatusIndicator.className = 'status-indicator on';
                                    conveyorToggleButton.textContent = 'Matikan';
                                } else {
                                    conveyorStatusText.textContent = 'OFF';
                                    conveyorStatusIndicator.className = 'status-indicator off';
                                    conveyorToggleButton.textContent = 'Nyalakan';
                                }
                            }
                        }
                    }

                    const logResponse = await fetch('/serial_log');
                    if (logResponse.ok) {
                        const logData = await logResponse.json();
                        if (serialMonitorOutput) serialMonitorOutput.textContent = logData.join('\n');
                    }

                } catch (error) { 
                    console.error("Gagal memperbarui dashboard:", error); 
                }
            }

            // Event listener untuk tombol (dengan null-check)
            if(conveyorToggleButton) {
                conveyorToggleButton.addEventListener('click', function() {
                    const newState = isConveyorOn ? 'off' : 'on';
                    console.log(`Mengirim perintah konveyor: ${newState}`);
                    fetch('/control', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ state: newState })
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Respon server untuk perintah kontrol:', data);
                    })
                    .catch(error => {
                        console.error('Error mengirim perintah kontrol:', error);
                    });
                });
            } else {
                console.error("Tombol kontrol konveyor tidak ditemukan saat menambahkan event listener.");
            }

            setInterval(updateDashboard, 2000);
        });
    </script>
</body>
</html>
