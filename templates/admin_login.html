
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Control Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0A192F;
            color: #E6F1FF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #112240;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px -15px rgba(0,0,0,0.7);
            text-align: center;
            width: 350px;
        }
        h1 {
            color: #64FFDA;
            margin-bottom: 30px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-group {
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #233554;
            background-color: #0A192F;
            color: #E6F1FF;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            background-color: #64FFDA;
            color: #0A192F;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #A7FFEE;
        }
        .error {
            color: #FF4C4C;
            margin-top: 15px;
        }
        .footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 14px;
            color: #8892B0;
        }
        .footer a {
            color: #64FFDA;
            text-decoration: none;
            margin: 0 10px;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Login</h1>
        <form method="post">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" name="username" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" name="password" id="password" required>
            </div>
            <button type="submit">Login</button>
            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}
        </form>
    </div>
    <div class="footer">
        <a href="/documentation">Dokumentasi</a> | 
        <a href="/about">Tentang Kami</a> | 
        <a href="/api-docs">Info API</a>
    </div>
</body>
</html>
