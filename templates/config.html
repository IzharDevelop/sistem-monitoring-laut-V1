
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfigurasi Koneksi - Control Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0A192F;
            color: #E6F1FF;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #112240;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px -15px rgba(0,0,0,0.7);
            text-align: center;
        }
        h1 {
            color: #64FFDA;
            margin-bottom: 30px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-group {
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #233554;
            background-color: #0A192F;
            color: #E6F1FF;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            background-color: #64FFDA;
            color: #0A192F;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #A7FFEE;
        }
        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: #8892B0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Interactive Control Dashboard</h1>
        <form method="post">
            <div class="form-group">
                <label for="port">Pilih Port Serial (COM):</label>
                <select name="port" id="port" required>
                    {% for port in ports %}
                        <option value="{{ port.device }}">{{ port.description }}</option>
                    {% endfor %}
                    {% if not ports %}
                        <option value="" disabled selected>Tidak ada port serial yang terdeteksi</option>
                    {% endif %}
                </select>
            </div>
            <div class="form-group">
                <label for="baudrate">Pilih Baud Rate:</label>
                <select name="baudrate" id="baudrate">
                    <option value="9600" selected>9600</option>
                    <option value="19200">19200</option>
                    <option value="38400">38400</option>
                    <option value="57600">57600</option>
                    <option value="115200">115200</option>
                </select>
            </div>
            <button type="submit" {% if not ports %}disabled{% endif %}>Hubungkan</button>
        </form>
    </div>
    <div class="footer">
        &copy; 2025 - Dibuat oleh Team Darubot
    </div>
</body>
</html>
